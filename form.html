<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alyssa Stringham">
    <meta name="description"
        content="an html form for a product review which contains a drop-down selection for products, a rating system, a date of installation, and options for useful features, written reviews, and user name.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
    <title>Product Review Form</title>
</head>

<body>
    <header>Product Review</header>
    <main>
        <form method="get" action="review.html" id="reviewForm">
            <fieldset>
                <legend>Required</legend>
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option selected disabled>Select a Product...</option>
                    <!--additional options created dynamically using provided product array; each must have value attribue that is the product name-->
                </select>
                <label>Overall Rating</label>
                <div class="stars">
                    <input type="radio" id="5star" name="stars" value="5" required><label for="5star"></label>
                    <input type="radio" id="4star" name="stars" value="4" required><label for="4star"></label>
                    <input type="radio" id="3star" name="stars" value="3" required><label for="3star"></label>
                    <input type="radio" id="2star" name="stars" value="2" required><label for="2star"></label>
                    <input type="radio" id="1star" name="stars" value="1" required><label for="1star"></label>
                </div>
                <label for="date">Date of Installation</label><input type="date" id="date" name="date" required>
            </fieldset>
            <fieldset>
                <legend>Optional</legend>
                <label>Useful Features</label>
                <label id="feature" for="quality">Quality</label><input type="checkbox" id="feature" name="quality"
                    value="yes">
                <label id="feature" for="durability">Durability</label><input type="checkbox" id="feature"
                    name="durability" value="yes">
                <label id="feature" for="performance">Performance</label><input type="checkbox" id="feature"
                    name="performance" value="yes">
                <label id="feature" for="materials">Materials</label><input type="checkbox" id="feature"
                    name="materials" value="yes">
                <label for="review">Written Review </label> <input type="textarea" id="review" name="review">
                <label for="fname">Your Name </label><input type="text" id="fname" name="fname">
            </fieldset>
            <input type="submit" value="Post Review">
        </form>
        <span id="submitCount">0</span>
    </main>
    <footer>
        <p> &copy; <span id="currentyear"></span> - Alyssa Stringham - Utah -</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
