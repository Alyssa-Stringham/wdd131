<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Consists of a message form which the user can submit. The form contains the required elements of first name, last name, email, and message, as well as an optional phone number.">
    <meta name="author" content="Alyssa Stringham">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Texturina:ital,opsz,wght@0,12..72,100..900;1,12..72,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/project.css">
    <script src="scripts/project.js" defer></script>
    <title>Alyssa's Dressage</title>
</head>

<body>
    <header>
        <h1>Dressage</h1>
        <a id="menu" href="#"></a>
        <nav>
            <ul class="navigation">
                <li><a href="index.html" data-title="Home">Home</a></li>
                <li><a href="terminology.html" data-title="Vocab">Terminology</a></li>
                <li><a href="movements.html" data-title="Levels">Levels</a></li>
                <li><a href="contact.html" data-title="Contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Contact</h2>

        <form method="get" action="message_sent.html" class="message" id="message">

            <legend>Your Information</legend>
            <label>First Name* <input type="text" name="fname" id="firstName" required></label>
            <label>Last Name* <input type="text" name="lname" required></label>
            <label>Phone Number <input type="tel" name="phone" placeholder="0001234567"></label>
            <label>Email* <input type="email" name="email" placeholder="email@address.com" required></label>

            <legend for="message">Type Your Message Here*</legend>
            <textarea id="message" name="message" required></textarea>


            <input type="submit" value="Send Message">
        </form>
    </main>
    <footer>
        <p> &copy; <span id="currentyear"></span> - Alyssa Stringham - Utah</p>
        <p id="lastModified"></p>
        <p><a href="references" id="ref">References</a></p>
    </footer>
</body>

</html>
